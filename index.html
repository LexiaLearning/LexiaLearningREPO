<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando aplicación...</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

    <div>
        <p>Cargando aplicación...</p>
        <p>Abriendo la aplicación en una nueva ventana limpia...</p>
    </div>

    <script type="text/javascript">
        // Abre una pestaña real 'about:blank' en el navegador
        var ventanaLimpia = window.open('about:blank', '_blank');

        if (ventanaLimpia) {
            // Crea un iframe a pantalla completa dentro de la ventana en blanco
            var doc = ventanaLimpia.document;
            doc.title = "Google Classroom";
            
            var iframe = doc.createElement('iframe');
            iframe.src = "https://lexialearning.github.io/LexiaPlusAPILearning/";
            
            // Estilos para que el juego/app ocupe todo el espacio sin bordes
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            iframe.style.position = "fixed";
            iframe.style.top = "0";
            iframe.style.left = "0";
            
            doc.body.style.margin = "0";
            doc.body.style.padding = "0";
            doc.body.style.overflow = "hidden";
            
            // Inserta el iframe en la pestaña en blanco
            doc.body.appendChild(iframe);
            
            // Regresa a la pestaña de origen a una página limpia o la cierra
            window.location.replace('https://classroom.google.com/');
        } else {
            // Si el navegador bloquea la ventana emergente, avisa al usuario
            alert("Por favor, permite las ventanas emergentes para abrir la aplicación de forma segura.");
        }
    </script>

</body>
</html>
